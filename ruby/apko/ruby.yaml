# Minimal Ruby image - using Wolfi's pre-built package
# Distroless, shell-less for security

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Base filesystem layout
    - wolfi-baselayout

    # Ruby from Wolfi (CVE-patched)
    - ruby-4.0
    - ruby4.0-bundler

    # Core runtime dependencies
    - glibc
    - glibc-locale-posix
    - ld-linux
    - libgcc
    - libstdc++

    # Ruby native extension dependencies
    - libffi
    - zlib
    - libssl3
    - libcrypto3
    - yaml
    - gmp
    - readline
    - ncurses
    - ncurses-terminfo-base

    # TLS/SSL certificates
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/ruby

work-dir: /app

environment:
  GEM_HOME: /app
  LANG: C.UTF-8
  PATH: /usr/bin:/bin

paths:
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

archs:
  - x86_64
  - aarch64
